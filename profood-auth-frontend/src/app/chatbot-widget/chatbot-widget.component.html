<button
  class="chat-toggle"
  type="button"
  (click)="toggleChat()"
  aria-label="Open ProFood assistant"
>
  <span>💬</span>
</button>

<div class="chat-window" *ngIf="isOpen">
  <div class="chat-header">
    <div class="chat-brand">
      <div class="brand-icon">P</div>

      <div>
        <h3>ProFood Assistant</h3>
        <p>Produits · Équipements · Services</p>
      </div>
    </div>

    <button
      class="close-btn"
      type="button"
      (click)="toggleChat()"
    >
      ×
    </button>
  </div>

  <div class="chat-body">
    <div
      *ngFor="let message of messages"
      class="message-wrapper"
      [class.user-wrapper]="message.role === 'user'"
      [class.assistant-wrapper]="message.role === 'assistant'"
    >
      <div
        class="message"
        [class.user]="message.role === 'user'"
        [class.assistant]="message.role === 'assistant'"
      >
        {{ message.text }}
      </div>

      <div
        class="sources"
        *ngIf="message.sources && message.sources.length > 0"
      >
        <p>Sources utilisées :</p>

        <ul>
          <li *ngFor="let source of message.sources.slice(0, 3)">
            {{ source.source || 'Document' }}
            <span *ngIf="source.page !== undefined">
              — page {{ source.page }}
            </span>
          </li>
        </ul>
      </div>
    </div>

    <div class="typing" *ngIf="loading">
      <span></span>
      <span></span>
      <span></span>
      ProFood AI réfléchit...
    </div>
  </div>

  <form class="chat-input" (ngSubmit)="sendMessage()">
    <input
      type="text"
      name="question"
      [(ngModel)]="question"
      placeholder="Posez votre question..."
      autocomplete="off"
    />

    <button
      type="submit"
      [disabled]="loading || !question.trim()"
    >
      Envoyer
    </button>
  </form>
</div>
